version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: talent-track-server
    container_name: talent-track-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:80"
    depends_on:
      - db

  db:
    image: postgres:13-alpine
    container_name: talent-track-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - talent_track_pgdata:/var/lib/postgresql/data

volumes:
  talent_track_pgdata:
    driver: local
